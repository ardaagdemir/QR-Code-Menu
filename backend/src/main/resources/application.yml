spring:
  application:
    name: qrmenu-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/qrmenu}
    username: ${SPRING_DATASOURCE_USERNAME:qrmenu}
    password: ${SPRING_DATASOURCE_PASSWORD:qrmenu}
  flyway:
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # Gap-analysis #11 (Section 15): OwnerNotificationPort's email adapter. Not a blocker
  # (spec: "WhatsApp entegrasyonu çekirdek raporlama için blocker değildir"), so unlike
  # internal.admin.token/payment.mock.webhook-secret below these have real defaults
  # rather than failing closed - pointed at the docker-compose "mailhog" dev SMTP catcher.
  mail:
    host: ${SMTP_HOST:mailhog}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

# Shared-secret guard for the /internal/** bootstrap API (PLATFORM_ADMIN, no dedicated
# UI in v1 - see docs/product-requirements.md Section 3/9). Empty by default so a
# misconfigured deployment fails closed instead of silently accepting any request.
internal:
  admin:
    token: ${INTERNAL_ADMIN_TOKEN:}

# customer-web's and staff-web's origins, allowed (with credentials) to call /api/** -
# see com.qrmenu.common.web.CorsConfig.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3002}

# PaymentProviderPort adapter selection (Section 2) - "mock" is the only adapter today.
# The webhook secret is empty by default so a misconfigured deployment fails closed
# (MockPaymentProviderAdapter.verifyWebhookSignature rejects every signature when
# blank), same discipline as internal.admin.token above.
payment:
  provider: ${PAYMENT_PROVIDER:mock}
  mock:
    webhook-secret: ${PAYMENT_MOCK_WEBHOOK_SECRET:}

owner-notification:
  email:
    from: ${OWNER_NOTIFICATION_FROM_EMAIL:no-reply@qrmenu.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
