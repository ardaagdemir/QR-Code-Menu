spring:
  application:
    name: qrmenu-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/qrmenu}
    username: ${SPRING_DATASOURCE_USERNAME:qrmenu}
    password: ${SPRING_DATASOURCE_PASSWORD:qrmenu}
  flyway:
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # Gap-analysis #15: uploads go through MediaStoragePort (product images, expense
  # receipts) - the receipt category's own 10MB cap (MediaCategory) is the real limit;
  # these are just Spring's multipart-parsing ceiling, kept a little above it for
  # multipart framing overhead.
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB
  # Gap-analysis #11 (Section 15): OwnerNotificationPort's email adapter. Not a blocker
  # (spec: "WhatsApp entegrasyonu çekirdek raporlama için blocker değildir"), so unlike
  # internal.admin.token/payment.mock.webhook-secret below these have real defaults
  # rather than failing closed - pointed at the docker-compose "mailhog" dev SMTP catcher.
  mail:
    host: ${SMTP_HOST:mailhog}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

# Shared-secret guard for the /internal/** bootstrap API (PLATFORM_ADMIN, no dedicated
# UI in v1 - see docs/product-requirements.md Section 3/9). Empty by default so a
# misconfigured deployment fails closed instead of silently accepting any request.
internal:
  admin:
    token: ${INTERNAL_ADMIN_TOKEN:}

# customer-web's and staff-web's origins, allowed (with credentials) to call /api/** -
# see com.qrmenu.common.web.CorsConfig.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3002}

# PaymentProviderPort adapter selection (Section 2) - "mock" is the only adapter today.
# The webhook secret is empty by default so a misconfigured deployment fails closed
# (MockPaymentProviderAdapter.verifyWebhookSignature rejects every signature when
# blank), same discipline as internal.admin.token above.
payment:
  provider: ${PAYMENT_PROVIDER:mock}
  mock:
    webhook-secret: ${PAYMENT_MOCK_WEBHOOK_SECRET:}

owner-notification:
  email:
    from: ${OWNER_NOTIFICATION_FROM_EMAIL:no-reply@qrmenu.local}

# Gap-analysis #15 (Section 3.2/16.1): MediaStoragePort's only adapter today is local
# filesystem (Section 27 - production provider not chosen yet). public-base-url must be
# the origin browsers can reach the backend at (not container-internal), since it's
# embedded in the Product.imageUrl/Expense.receiptImageUrl values returned to the client.
media:
  storage:
    local:
      base-dir: ${MEDIA_STORAGE_LOCAL_BASE_DIR:./data/media}
    public-base-url: ${MEDIA_STORAGE_PUBLIC_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # Owner-notification email (Section 15) is explicitly non-blocking for the core
    # product ("WhatsApp entegrasyonu... blocker değildir", same spirit for email) - an
    # unreachable/slow SMTP provider must not flip Docker's backend healthcheck (used
    # for restart policy + depends_on readiness gating) to unhealthy.
    mail:
      enabled: false
