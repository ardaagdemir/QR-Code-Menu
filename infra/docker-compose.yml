services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qrmenu}
      POSTGRES_USER: ${POSTGRES_USER:-qrmenu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qrmenu}
    ports:
      # Host-side 5433 avoids clashing with a locally installed PostgreSQL on the
      # default 5432 port. Container-to-container traffic (backend -> postgres)
      # still uses the standard 5432 internally, unaffected by this mapping.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qrmenu} -d ${POSTGRES_DB:-qrmenu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-qrmenu}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-qrmenu}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-qrmenu}
      # Shared secret guarding the /internal/** PLATFORM_ADMIN bootstrap API (Milestone 2).
      INTERNAL_ADMIN_TOKEN: ${INTERNAL_ADMIN_TOKEN:?set INTERNAL_ADMIN_TOKEN in infra/.env}
      # HMAC secret the mock payment provider signs/verifies webhook bodies with (Milestone 5).
      PAYMENT_MOCK_WEBHOOK_SECRET: ${PAYMENT_MOCK_WEBHOOK_SECRET:?set PAYMENT_MOCK_WEBHOOK_SECRET in infra/.env}
      # Browser-facing origins allowed to call /api/** (customer-web, staff-web).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3002}
      # Gap-analysis #11: OwnerNotificationPort email adapter - dev SMTP catcher is the
      # "mailhog" service below, no real provider/credentials needed locally.
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      OWNER_NOTIFICATION_FROM_EMAIL: ${OWNER_NOTIFICATION_FROM_EMAIL:-no-reply@qrmenu.local}
      # Gap-analysis #15: MediaStoragePort's local adapter - container-internal path
      # (backed by the media_data volume below, survives container recreation);
      # public-base-url is the browser-facing origin, not this container-internal one.
      MEDIA_STORAGE_LOCAL_BASE_DIR: /data/media
      MEDIA_STORAGE_PUBLIC_BASE_URL: ${MEDIA_STORAGE_PUBLIC_BASE_URL:-http://localhost:8080}
    volumes:
      - media_data:/data/media
    ports:
      - "8080:8080"

  # Gap-analysis #11: local SMTP catcher for OwnerNotificationPort's email adapter - no
  # real mailbox needed in dev, sent mail is viewable at http://localhost:8025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"

  customer-web:
    build:
      context: ../frontend/customer-web
      args:
        # Inlined into the JS bundle at build time (see frontend/customer-web/Dockerfile).
        # Local default only - docker-compose.prod.yml requires a real value.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: BusyBox wget on Alpine resolves "localhost" to ::1
      # first and doesn't fall back to IPv4, but Node's server only listens on IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    ports:
      - "3000:3000"

  staff-web:
    build:
      context: ../frontend/staff-web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    ports:
      - "3002:3002"

volumes:
  postgres_data:
  media_data:
